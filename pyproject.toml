[project]
name = "wealthgrabber"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "requests>=2.34.2",
    "ws-api>=0.39.3",
    "typer>=0.27.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
wealthgrabber = "wealthgrabber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "memvid-sdk>=2.0.160",
    "networkx>=3.7",
    "pathspec>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "watchdog>=6.0.0",
]
